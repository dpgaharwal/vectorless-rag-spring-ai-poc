spring:
  application:
    name: vectorless-rag-poc

  datasource:
    url: jdbc:postgresql://localhost:5433/vectorrag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    active-provider: openai

    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.2

    google:
      genai:
        api-key: ${GEMINI_API_KEY:your-gemini-key-here}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0.2

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-claude-key-here}
      chat:
        options:
          model: claude-sonnet-4-20250514
          temperature: 0.2

    openai:
      api-key: "api-key"
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          stream-usage: false

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

vectorless:
  tree:
    max-pages-per-node: 10
    toc-check-pages: 20
    store-dir: tree-store/

server:
  port: 8080

logging:
  level:
    com.vectorlessrag: DEBUG
    org.springframework.ai: INFO