# pageindex-spring-ai — sample configuration
# Copy these properties into your application.yaml and set your API key.
#
# The library requires only a Spring AI ChatModel bean in the context.
# Add whichever provider starter you prefer to your pom.xml, e.g.:
#   spring-ai-starter-model-openai
#   spring-ai-starter-model-anthropic
#   spring-ai-starter-model-ollama
#   spring-ai-starter-model-google-genai

pageindex:
  # LLM model used for indexing (tree building, TOC processing, verification)
  model: gpt-4o-2024-11-20
  # LLM model used for retrieval navigation (defaults to 'model' if not set)
  # retrieve-model: gpt-4o-mini
  # How many pages from the start to scan for a Table of Contents
  toc-check-page-num: 20
  # Max pages per leaf node before recursive splitting kicks in
  max-page-num-each-node: 10
  # Max tokens per leaf node before recursive splitting kicks in
  max-token-num-each-node: 20000
  # Assign sequential 4-digit IDs to every node (e.g. "0001")
  add-node-id: true
  # Generate LLM summaries for every node
  add-node-summary: true
  # Generate a one-line description of the whole document
  add-doc-description: false
  # Include raw page text inside each node in the stored JSON
  add-node-text: false
  # Directory where indexed document JSON files are persisted
  store-dir: pageindex-store/
  # Thread pool size for concurrent LLM calls during indexing
  concurrency:
    pool-size: 10

