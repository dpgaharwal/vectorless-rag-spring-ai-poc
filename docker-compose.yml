version: '3.8'
services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectorrag
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  ollama_data:
  pg_data: